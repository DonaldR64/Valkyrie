<input type="hidden" class="sheet-tabstoggle" name="attr_sheetTab"  value="display"  />
<div>
    <button type="action" name="act_input" >Input</button>
    <button type="action" name="act_ship" >Ship</button>
</div>

<div class="sheet-input">
    <div class="2colrow">
        <div class="col">
            <h3>Unit Information</h3>
            <label>Name:</label><input type="text" name="attr_character_name">
            <br>
            <label>Class:</label><input type="text" name="attr_class">
            <br>
            <label for="attr_faction">Faction:</label>
            <select name="attr_faction">
                <option value="" selected disabled hidden>Choose here</option>
                <option value="Federation">Federation</option>
                <option value="Klingon">Klingon</option>
            </select>
            <label>Top Pic URL</label><input type="text" name="attr_toppic" />
        </div>
            
        <div class="col">
            <h3>Stats</h3>
            <label>Total Mass:</label><input type="number" name="attr_mass">
            <label>Combat Points:</label><input type="number" name="attr_cpv">
            <label for="attr_type">Type:</label>
            <select name="attr_type">
                <option value="" selected disabled hidden>Choose here</option>
                <option value="Starship">Starship</option>
                <option value="Objective">Objective</option>
                <option value="Asteroid">Asteroid</option>
                <option value="System">System</option>
            </select>  
        </div>

        <div class="col">
            <h3>Systems</h3>
            <label>Impulse Engines:</label><input type="number" name="attr_impulse">
            <label>Current Hull:</label><input type="number" name="attr_hull">
            <label>Max Hull:</label><input type="number" name="attr_hull_max">  
            <label>Advanced Hull:</label><input type="checkbox" name="attr_advancedhull" value="1">
            <label>Shield Generator 1:</label><input type="checkbox" name="attr_shield1" value="1">            
            <label>Shield Generator 2:</label><input type="checkbox" name="attr_shield2" value="1">   
            <label>Shield Generator 3:</label><input type="checkbox" name="attr_shield3" value="1">   
            <label>Fire Control 1:</label><input type="checkbox" name="attr_fc1" value="1">            
            <label>Fire Control 2:</label><input type="checkbox" name="attr_fc2" value="1">       
            <label>Fire Control 3:</label><input type="checkbox" name="attr_fc3" value="1">       
            <label>Cloaking Device:</label><input type="checkbox" name="attr_cloaking" value="1">   
        </div>



    </div>    





    <div class="row">
        <h3>Weapons</h3>

        <div class="weapons">
            <table>
            <thead>
                <tr>
                    <th>Status</th>
                    <th>System</th>
                    <th>Name</th>
                    <th>Type</th>
                    <th>Facing</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td><select name="attr_weapon1status">
                        <option value = "Off">Off</option>
                        <option value = "Normal">Normal</option>
                        <option value = "Damaged">Damaged</option>
                    </select></td>
                    <td>A</td>
                    <td><input type="text" name="attr_weapon1name"></td>
                    <td><select name="attr_weapon1type">
                        <option value = "Beam-1">Beam-1</option>
                        <option value = "Beam-2">Beam-2</option>
                        <option value = "Beam-3">Beam-3</option> 
                        <option value = "Photon Torpedo">Photon Torpedo</option>
                        <option value = "Disruptor">Disruptor</option>
                        <option value = "Mk2. Disruptor">Mk2. Disruptor</option>
                        <option value = "Plasma Bolt Launcher">Plasma Bolt Launcher</option>
                    </select></td>                 
                    <td><input type="text" name="attr_weapon1facing"></td>
                </tr>
            </tbody>
            </table>    
        </div>    
    </div>    


</div>



<div class="sheet-ship">
    <input type="hidden" name="attr_faction"/>

    <div class="mysheet">
      <div class="attributes">

        <main>
        <input type="hidden" name="attr_faction"/>

        <section class="top">
            <div class="sidepic">
                <img alt="Character Avatar" name="attr_character_avatar"/>
            </div>
            <div class="namearea">
                <h1><span name="attr_character_name"></span></h1>
                <h3><span name="attr_class"></span> Class</h3>
                <h3><span name="attr_type"></span></h3>
                <h4>Size: <span name="attr_size"></span></h4>
            </div>
            <div class="iconarea">
                <img name="attr_factionsymbol"/>
            </div>
        </section>

        <section class="power">
            <h3>Engineering</h3>

            
        </section>


        <section class="ship">
           Placeholder
        </section>    

        <section class="helm">
            <h3>Helm</h3>

        </section>

        <section class="ops">
            <h3>Operations</h3>
            
        </section>



        <section class="weapons">
            <div class="weaponheader">
                <h3>Tactical</h3>
            </div>   
            <div class="weaponinfo">
                <div><span>System</span></div>
                <div><span>Name</span></div>
                <div><span>Type</span></div>
                <div><span>Facing</span></div>
                <div><span>Range</span></div>
                <div><span>Damage</span></div>
            </div>

            <input type="hidden" name="attr_weapon1status" class="weapon1-status" value="Off">
            <div class="weapon1">
                <h4>A</span></h4>
                <h4><span name="attr_weapon1name"></span></h4>
                <h4><span name="attr_weapon1type"></span></h4>
                <h4><span name="attr_weapon1facing"></span></h4>
                <h4><span name="attr_weapon1range"></span></h4>
                <h4><span name="attr_weapon1damage"></span></h4>
            </div>

        </section>
        </main>
      </div>
    </div>    
</div>





<script type="text/worker">
    const buttonlist = ["input","ship"];
    var checked = 0;
    buttonlist.forEach(button => {
        on(`clicked:${button}`, function() {
            setAttrs({
                sheetTab: button
            });
        });
    });

    on("sheet:opened", function() {
        setAttrs({sheetTab:"ship"});
    });

    


 

</script>
