<input type="hidden" class="sheet-tabstoggle" name="attr_sheetTab"  value="display"  />
<div>
    <button type="action" name="act_input" >Input</button>
    <button type="action" name="act_ship" >Ship</button>
</div>

<div class="sheet-input">
    <div class="2colrow">
        <div class="col">
            <h3>Unit Information</h3>
            <label>Name:</label><input type="text" name="attr_character_name">
            <br>
            <label>Class:</label><input type="text" name="attr_class">
            <br>
            <label for="attr_faction">Faction:</label>
            <select name="attr_faction">
                <option value="" selected disabled hidden>Choose here</option>
                <option value="Federation">Federation</option>
                <option value="Klingon">Klingon</option>
            </select>
            <label>Top Pic URL</label><input type="text" name="attr_toppic" />
        </div>
            
        <div class="col">
            <h3>Stats</h3>
            <label>Total Mass:</label><input type="number" name="attr_mass">
            <label>Combat Points:</label><input type="number" name="attr_cpv">
            <label for="attr_type">Type:</label>
            <select name="attr_type">
                <option value="" selected disabled hidden>Choose here</option>
                <option value="Starship">Starship</option>
                <option value="Objective">Objective</option>
                <option value="Asteroid">Asteroid</option>
                <option value="System">System</option>
            </select>  
        </div>

        <div class="col">
            <h3>Systems</h3>
            <label>Impulse Engines:</label><input type="number" name="attr_impulse">
            <label>Max Hull:</label><input type="number" name="attr_hull_max">  
            <label>Advanced Hull:</label><input type="checkbox" name="attr_advancedhull" value="1">
            <label>Max Crew (Hull/20 rounded up):</label><input type="number" name="attr_crew_max">
            <label for="attr_shieldgenerators"># of Shield Generators:</label>
            <select name="attr_shieldgenerators_max">
                <option value="0">0</option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
            </select>  
            <label for="attr_firecontrol"># of Fire Control Centres:</label>
            <select name="attr_firecontrol_max">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
            </select>    
            <label>Cloaking Device:</label><input type="checkbox" name="attr_cloaking" value="1">   
        </div>



    </div>    





    <div class="row">
        <h3>Weapons</h3>

        <div class="weapons">
            <table>
            <thead>
                <tr>
                    <th>Status</th>
                    <th>System</th>
                    <th>Name</th>
                    <th>Type</th>
                    <th>Facing (1-6)</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td><select name="attr_weapon1status">
                        <option value = "Off">Off</option>
                        <option value = "Normal">Normal</option>
                        <option value = "Damaged">Damaged</option>
                    </select></td>
                    <td>A</td>
                    <td><input type="text" name="attr_weapon1name"></td>
                    <td><select name="attr_weapon1type">
                        <option value = "Class 1 Beam">Class 1 Beam</option>
                        <option value = "Class 2 Beam">Class 2 Beam</option>
                        <option value = "Class 3 Beam">Class 3 Beam</option> 
                        <option value = "Photon Torpedo">Photon Torpedo</option>
                        <option value = "Disruptor">Disruptor</option>
                        <option value = "Mk2. Disruptor">Mk2. Disruptor</option>
                        <option value = "Plasma Bolt Launcher">Plasma Bolt Launcher</option>
                    </select></td>                 
                    <td><input type="text" name="attr_weapon1facing"></td>
                </tr>
            </tbody>
            </table>    
        </div>    
    </div>    


</div>



<div class="sheet-ship">
    <input type="hidden" name="attr_faction"/>

    <div class="mysheet">
      <div class="attributes">

        <main>
        <input type="hidden" name="attr_faction"/>

        <section class="top">
            <div class="sidepic">
                <img alt="Character Avatar" name="attr_character_avatar"/>
            </div>
            <div class="namearea">
                <h1><span name="attr_character_name"></span></h1>
                <h3><span name="attr_class"></span></h3>
            </div>
            <div class="iconarea">
                <img name="attr_factionsymbol"/>
            </div>
        </section>

        <section class="power">
            <h3>Engineering</h3>

            
        </section>


        <section class="ship">
           Placeholder
        </section>    

        <section class="helm">
            <h3>Helm</h3>

        </section>

        <section class="ops">
            <h3>OPS</h3>

            <input type="hidden" name="attr_commandstatus" class="command-status" value="Red">
            <div class="commandstatus">
                <h4>Command: <span name="attr_command"></span></h4>
            </div>

            <input type="hidden" name="attr_lifesupportstatus" class="lifesupport-status" value="Red">
            <div class="lifesupportstatus">
                <h4>Life Support: <span name="attr_lifesupport"></span></h4>
            </div>

            <input type="hidden" name="attr_warpcorestatus" class="warpcore-status" value="Red">
            <div class="warpcorestatus">
                <h4>Warp Core: <span name="attr_warpcore"></span></h4>
            </div>

            <input type="hidden" name="attr_hullstatus" class="hull-status" value="Red">
            <div class="hullstatus">
                <h4>Hull Integrity: <span name="attr_hull"></span> / <span name="attr_hull_max"></span></h4>
            </div>

            <input type="hidden" name="attr_shieldstatus" class="shield-status" value="Red">
            <div class="shieldstatus">
                <h4>Shield Level: <span name="attr_shieldlevel"></span></h4>
            </div>

            <input type="hidden" name="attr_firecontrolstatus" class="firecontrol-status" value="Red">
            <div class="firecontrol">
                <h4>Fire Control: <span name="attr_firecontrol"></span> / <span name="attr_firecontrol_max"></span></h4>
            </div>

            <input type="hidden" name="attr_hullstatus" class="crew-status" value="Red">
            <div class="crewstatus">
                <h4>Crew Level: <span name="attr_crew"></span> / <span name="attr_crew_max"></span></h4>
            </div>







        </section>



        <section class="weapons">
            <div class="weaponheader">
                <h3>Tactical</h3>
            </div>   
            <div class="weaponinfo">
                <div><span>System</span></div>
                <div><span>Name</span></div>
                <div><span>Type</span></div>
                <div><span>Range</span></div>
                <div><span>Damage</span></div>
            </div>

            <input type="hidden" name="attr_weapon1status" class="weapon1-status" value="Off">
            <div class="weapon1">
                <h4>A</span></h4>
                <h4><span name="attr_weapon1name"></span></h4>
                <h4><span name="attr_weapon1type"></span></h4>
                <h4><span name="attr_weapon1range"></span></h4>
                <h4><span name="attr_weapon1damage"></span></h4>
            </div>

        </section>
        </main>
      </div>
    </div>    
</div>





<script type="text/worker">
    const buttonlist = ["input","ship"];
    var checked = 0;
    buttonlist.forEach(button => {
        on(`clicked:${button}`, function() {
            setAttrs({
                sheetTab: button
            });
        });
    });

    on("sheet:opened", function() {
        setAttrs({sheetTab:"ship"});
    });

    on("change:attrs sheet:opened", function(eventInfo) { 
        getAttrs(["command","lifesupport","warpcore","hull","hull_max","advancedhull","shieldgenerators","shieldgenerators_max","firecontrol","firecontrol_max"], function(values) {
            let commandstatus = "Green";
            if (values.command === "Destroyed") {commandstatus = "Red"};
            if (values.command.includes("Damaged")) {commandstatus = "Orange"};

            let lifesupportstatus = "Red";
            if (values.lifesupport === "Normal") {lifesupportstatus = "Green"};

            let warpcorestatus = "Red";
            if (values.warpcore === "Normal") {warpcorestatus = "Green"};

            let hullMax = parseInt(values.hull_max);
            let hull = parseInt(values.hull);
            let adv = 4;
            if (advancedhull === "1") {adv = 3};
            let hullLevel = Math.ceil(hull / (hullMax/adv)) - 1;
            let hullColours = ["Red","Orange","Yellow","Green"];
            let hullstatus = hullColours[hullLevel];

            let shieldstatus = "Green";

            if (sg < sgMax) {shieldstatus = "Yellow"};
            if (sg === 0) {shieldstatus = "Red"};

            let firecontrolstatus = "Green";
            let fc = parseInt(values.firecontrol);
            let fcMax = parseInt(value.firecontrol_max);
            if (fc < fcMax) {firecontrolstatus = "Yellow"};
            if (fc === 0) {firecontrolstatus = "Red"};


            setAttrs({
                commandstatus: commandstatus,
                lifesupportstatus: lifesupportstatus,

                shieldstatus: shieldstatus,
                firecontrolstatus: firecontrolstatus,


            });
        });
    });
</script>
